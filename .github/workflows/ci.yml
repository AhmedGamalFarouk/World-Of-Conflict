name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Typecheck, lint, mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - run: npm run lint:github
      # Targeted, not the 10-minute suite: the mobile layer and the import rules.
      - run: >-
          npx vitest run tests/client/mobile tests/client/MobileShell.test.ts
          tests/MobileBuild.test.ts tests/AndroidTools.test.ts
          tests/LayerBoundaries.test.ts tests/Workflows.test.ts
          tests/AndroidResources.test.ts tests/SaveResume.test.ts
